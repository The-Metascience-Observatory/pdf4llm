version: '3.8'

services:
  # GROBID with DeLFT support (CPU-optimized for highest accuracy)
  # Uses default GROBID configuration with all DeLFT models enabled
  grobid-delft:
    image: grobid/grobid:0.8.2-full
    container_name: grobid-delft
    # `ports` (not `network_mode: host`) — host networking does not work on
    # Docker Desktop for macOS; the container would be unreachable from the host.
    ports:
      - "8070:8070"
    environment:
      - JAVA_OPTS=-Xmx6g -Xms2g
    healthcheck:
      # The image has no curl/wget/python3 -- only bash. The previous check
      # shelled out to python3 and so exited 127 forever, marking the container
      # permanently "unhealthy" no matter what GROBID was doing. bash's
      # /dev/tcp needs nothing extra.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8070 && printf 'GET /api/isalive HTTP/1.0\r\n\r\n' >&3 && grep -q true <&3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # DeLFT models take time to load
    profiles:
      - delft

  # GROBID with CRF only (fastest CPU performance)
  grobid-crf:
    image: grobid/grobid:0.8.2-crf
    container_name: grobid-crf
    ports:
      - "8070:8070"
    environment:
      - JAVA_OPTS=-Xmx4g -Xms2g
    healthcheck:
      # The image has no curl/wget/python3 -- only bash. The previous check
      # shelled out to python3 and so exited 127 forever, marking the container
      # permanently "unhealthy" no matter what GROBID was doing. bash's
      # /dev/tcp needs nothing extra.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8070 && printf 'GET /api/isalive HTTP/1.0\r\n\r\n' >&3 && grep -q true <&3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - crf
